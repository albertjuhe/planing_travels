framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true

    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax

    cache: ~

    http_client: ~

    rate_limiter:
        itinerary_generation:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'
